<svg width="420" height="100" viewBox="0 0 420 100" xmlns="http://www.w3.org/2000/svg">
  <title>Codelydev logo dark</title>
  <desc>Codelydev logo for dark backgrounds</desc>

  <!-- Dark background -->
  <rect width="420" height="100" fill="#0a0d14"/>

  <!-- Icon mark -->
  <rect x="0" y="0" width="100" height="100" rx="20" fill="#1a2035"/>
  <rect x="0.75" y="0.75" width="98.5" height="98.5" rx="19.5" fill="none" stroke="#2a3a5c" stroke-width="1.5"/>
  <polyline points="32,26 20,50 32,74" fill="none" stroke="#6ba3ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="68,26 80,50 68,74" fill="none" stroke="#6ba3ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="60" y1="26" x2="40" y2="74" stroke="#34d9c3" stroke-width="6.5" stroke-linecap="round"/>

  <!-- Wordmark -->
  <text font-family="'SF Pro Display','Segoe UI',system-ui,sans-serif" font-size="36" letter-spacing="-0.5">
    <tspan x="118" y="56" font-weight="300" fill="#f0f4ff">codely</tspan><tspan font-weight="700" fill="#6ba3ff">dev</tspan>
  </text>

  <!-- Divider -->
  <line x1="118" y1="68" x2="390" y2="68" stroke="#2a3a5c" stroke-width="0.75"/>

  <!-- Tagline -->
  <text x="118" y="84" font-family="'SF Pro Display','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="500" letter-spacing="3.5" fill="#4a6080">CODE · LEARN · BUILD</text>
</svg>
